# BarazArte · producción (Coolify). Usa este fichero como "Docker Compose Location" del recurso.
#
# - Ningún servicio publica puertos en el host: Coolify enruta por dominio a los puertos internos.
# - Los servicios internos usan alias únicos (baraz-db, baraz-redis, baraz-storage, baraz-api) para que
#   sus nombres no colisionen con los de otras apps si Coolify las conecta a una red compartida.
# - Todas las claves y URLs vienen de variables de entorno de Coolify (ver README, sección Deploy).
#
# Dominios a asignar en Coolify (una dirección por servicio, con HTTPS):
#   frontend -> https://barazarte.com            (puerto 3000)
#   backend  -> https://api.barazarte.com        (puerto 8000)
#   storage  -> https://media.barazarte.com      (puerto 9000)   <- fotos públicas de las obras
# Usa subdominios del MISMO dominio: la cookie de sesión es SameSite=Strict.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: barazarte
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: barazarte
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      default:
        aliases: [baraz-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barazarte"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      default:
        aliases: [baraz-redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Almacenamiento S3 de las fotos (MinIO ya no publica imágenes oficiales). Su puerto 9000 debe tener dominio público.
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Define S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Define S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    expose:
      - "9000"
    networks:
      default:
        aliases: [baraz-storage]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 2 -b 0.0.0.0:8000"
    environment: &backend_env
      APP_ENV: production
      DOCS_ENABLED: "false"
      TRUST_PROXY_HEADERS: "true"
      FRONTEND_BASE_URL: ${FRONTEND_URL:?Define FRONTEND_URL, p.ej. https://barazarte.com}
      CORS_ORIGINS: ${FRONTEND_URL}
      DATABASE_URL: postgresql+psycopg://barazarte:${POSTGRES_PASSWORD}@baraz-db:5432/barazarte
      REDIS_URL: redis://baraz-redis:6379/0
      RATE_LIMIT_BACKEND: redis
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Define JWT_SECRET_KEY (openssl rand -hex 32)}
      COOKIE_SECURE: "true"
      MINIO_ENDPOINT: baraz-storage:9000
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_BUCKET_NAME: barazarte
      MINIO_SECURE: "false"
      MINIO_PUBLIC_BASE_URL: ${MEDIA_URL:?Define MEDIA_URL, p.ej. https://media.barazarte.com}
      # Valores iniciales del correo; el admin los sustituye desde /admin/correo (se guardan en la base de datos).
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-BarazArte <no-reply@barazarte.com>}
    expose:
      - "8000"
    networks:
      default:
        aliases: [baraz-api]
    healthcheck:
      # start_period largo: al arrancar aplica las migraciones de la base de datos antes de servir.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage: {condition: service_started}

  # Worker de Celery: envía los emails (verificación, consultas, recuperar contraseña).
  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=INFO
    environment: *backend_env
    healthcheck:
      # Pregunta al propio worker por el broker (Redis); $$ evita que Compose interpole la variable.
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -t 5 -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:?Define API_URL, p.ej. https://api.barazarte.com}
    restart: unless-stopped
    environment:
      # El servidor de Next habla con la API por la red interna, sin salir a internet.
      INTERNAL_API_URL: http://baraz-api:8000
    expose:
      - "3000"
    healthcheck:
      # 127.0.0.1 y no localhost: en Alpine localhost resuelve a IPv6 y Next escucha en IPv4.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - backend

volumes:
  postgres-data:
  storage-data:
